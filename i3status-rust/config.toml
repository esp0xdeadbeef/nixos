# Config for i3blocks-rs

icons_format = "{icon}"

[theme]
theme = "solarized-dark"
[theme.overrides]
#idle_bg = "#123456"
idle_bg = "#000000"
idle_fg = "#dddddd"

[icons]
icons = "awesome4"
#[icons.overrides]
##bat = ["|E|", "|_|", "|=|", "|F|"]
#bat = ["|E|", "? UNK", "🪫 BAT", "🔋 FULL"]
#bat_charging = "🔌 CHR "
[icons.overrides]
bat_charging = "\uf1e6 CHR" # fa-plug
bat = [
    "\uf244: empty", # fa-battery-empty
    "\uf243: quarter", # fa-battery-quarter
    "\uf242: half", # fa-battery-half
    "\uf241: ", # fa-battery-three-quarters
    "\uf240: FULL", # fa-battery-full
]
bat_not_available = "\uf244 ? UNK" # fa-battery-empty
#cpu = "🧮"

[[block]]
block = "net"
format = " $icon {$signal_strength $ssid $frequency|LAN} via $device "

[[block]]
block = "custom"
command = "~/.config/i3status-rust/get_ipv4.sh"
interval = 60

[[block]]
block = "custom"
command = "~/.config/i3status-rust/get_ipv6.sh"
interval = 60

[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"


