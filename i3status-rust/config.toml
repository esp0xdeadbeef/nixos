[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " $icon /: $available.eng(w:2) "

[[block]]
block = "disk_space"
path = "/home/deadbeef/second-ssd"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " $icon mnt: $available.eng(w:2) "

#[[block]]
#block = "sound"
#device = "default"
#mixer = "Master"
#format = "♪: {volume}%"
#format_muted = "♪: muted ({volume}%)"

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "
format_alt = " $icon_swap $swap_used_percents.eng(w:2) "

[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90


[[block]]
block = "custom"
command = "~/.config/i3status-rust/gpu-load.sh"
interval = 1
json = true

[[block]]
block = "battery"
format = "$icon $percentage {$time |}"
device = "DisplayDevice"
driver = "upower"


[[block]]
block = "time"
interval = 1
#format = " $timestamp.datetime(f:'%d-%m-%Y %R:%S') "
format = " $timestamp.datetime(f:'%Y-%m-%d %R:%S') "
