session_name: rsync update reboot
windows:
  - window_name: testing
    layout: main-vertical
    panes:
      - shell_command: |
          while :; do ./rsync-update-reboot.sh s-lxc-test ; done
      - shell_command: |
          while :; do ./rsync-update-reboot.sh s-test-vm-impermanence ; done
  - window_name: routers
    layout: main-vertical
    panes:
      - shell_command: |
          while :; do ./rsync-update-reboot.sh s-router-access; done
      - shell_command: |
          while :; do ./rsync-update-reboot.sh s-router-vpn-egress ; done
      - shell_command: |
          while :; do ./rsync-update-reboot.sh s-router-edge; done
      - shell_command: |
          while :; do ./rsync-update-reboot.sh s-router-core; done
  - window_name: hypervisors
    layout: main-vertical
    panes:
      - shell_command: |
          while :; do ./rsync-update-reboot.sh s-sigma; done
