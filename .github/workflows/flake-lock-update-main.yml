name: "Flake.lock: update and push"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Update flake.lock
        run: nix flake update

      - name: Check flake outputs in isolated evaluations
        shell: bash
        run: |
          set -euo pipefail

          list_attrs() {
            nix eval --raw "$1" \
              --apply 'attrs: builtins.concatStringsSep "\n" (builtins.attrNames attrs)'
          }

          check_derivation() {
            local attribute="$1"
            echo "::group::Checking ${attribute}"
            nix derivation show ".#${attribute}" >/dev/null
            echo "::endgroup::"
          }

          # Hosts are discovered from directories by flake.nix, so this loop
          # sees every host -- including laptops and dedicated VMs that have
          # no VM manager at all. Classify each host by what its configuration
          # actually contains rather than by a hand-maintained list: a stale
          # list sent l-envil (which deliberately has no nixosShellVmManager
          # option) down the carrier path and crashed with `attribute
          # 'nixosShellVmManager' missing`, while omitting s-nodus and
          # s-nodus-nixos-hardware, which do embed every guest image.
          #
          # Prints one of: carrier | vmhost | plain, one line per host.
          # Classified in a single evaluation so this costs one extra `nix
          # eval` for the whole repository rather than one per host.
          classify_hosts() {
            # shellcheck disable=SC2016
            nix eval --raw --impure --expr '
              let
                configs = (builtins.getFlake (toString ./.)).nixosConfigurations;
                kindOf =
                  name:
                  let
                    config = configs.${name}.config;
                    manager =
                      if config ? services && config.services ? nixosShellVmManager
                      then config.services.nixosShellVmManager
                      else null;
                  in
                  if manager == null then "plain"
                  else if manager.carrierControls or { } != { } then "carrier"
                  else "vmhost";
              in
              builtins.concatStringsSep "\n"
                (map (n: "${n} ${kindOf n}") (builtins.attrNames configs))
            '
          }

          check_vm_host() {
            local host="$1"

            echo "::group::Checking ${host} with carrier-controlled VMs enabled"
            # The ${host} below is Nix interpolation, not shell interpolation.
            # shellcheck disable=SC2016
            nix derivation show \
              --impure \
              --argstr host "${host}" \
              --expr '
                { host }:
                let
                  flake = builtins.getFlake (toString ./.);
                  original = flake.nixosConfigurations.${host};
                  manager = original.config.services.nixosShellVmManager;
                  instanceNames = builtins.attrNames manager.instances;
                  # carrierControls is optional; a host may have the manager
                  # without any carrier rule.
                  carrierInstances =
                    builtins.concatMap
                      (control: control.instances)
                      (builtins.attrValues (manager.carrierControls or { }));
                  filtered = original.extendModules {
                    modules = [
                      ({ lib, ... }: {
                        services.nixosShellVmManager.instances =
                          builtins.listToAttrs (
                            map
                              (name: {
                                inherit name;
                                value.enable = lib.mkForce (
                                  builtins.elem name carrierInstances
                                  || (
                                    carrierInstances == [ ]
                                    && name == builtins.head instanceNames
                                  )
                                );
                              })
                              instanceNames
                          );
                      })
                    ];
                  };
                in
                filtered.config.system.build.toplevel
              ' >/dev/null
            echo "::endgroup::"
          }

          configurations="$(list_attrs '.#nixosConfigurations')"
          host_kinds="$(classify_hosts)"
          while IFS= read -r configuration; do
            [[ -n "${configuration}" ]] || continue
            # Derived, never hardcoded: a host that grows a VM manager is
            # picked up automatically, and one that never had it cannot be
            # routed into check_vm_host by a stale list.
            kind="$(awk -v h="${configuration}" '$1 == h { print $2 }' <<<"${host_kinds}")"
            case "${kind}" in
              carrier | vmhost)
                # These hosts embed nixos-shell guest images. Evaluate with
                # only carrier-controlled instances enabled to keep the host
                # toplevel evaluation cheap; every guest configuration is
                # evaluated independently by the surrounding loop.
                check_vm_host "${configuration}"
                ;;
              plain)
                check_derivation \
                  "nixosConfigurations.${configuration}.config.system.build.toplevel"
                ;;
              *)
                echo "::error::could not classify host '${configuration}' (got '${kind}')" >&2
                exit 1
                ;;
            esac
          done <<<"${configurations}"

          systems="$(list_attrs '.#packages')"
          while IFS= read -r system; do
            [[ -n "${system}" ]] || continue
            packages="$(list_attrs ".#packages.${system}")"
            while IFS= read -r package; do
              [[ -n "${package}" ]] || continue
              check_derivation "packages.${system}.${package}"
            done <<<"${packages}"
          done <<<"${systems}"

          formatter_systems="$(list_attrs '.#formatter')"
          while IFS= read -r system; do
            [[ -n "${system}" ]] || continue
            check_derivation "formatter.${system}"
          done <<<"${formatter_systems}"

          overlays="$(list_attrs '.#overlays')"
          while IFS= read -r overlay; do
            [[ -n "${overlay}" ]] || continue
            nix eval --raw ".#overlays.${overlay}" \
              --apply 'value:
                if builtins.isFunction value
                then "ok"
                else throw "overlay is not a function"' >/dev/null
          done <<<"${overlays}"

          nixos_modules="$(list_attrs '.#nixosModules')"
          while IFS= read -r nixos_module; do
            [[ -n "${nixos_module}" ]] || continue
            nix eval --raw ".#nixosModules.${nixos_module}" \
              --apply 'value:
                if builtins.isFunction value
                  || builtins.isAttrs value
                  || builtins.typeOf value == "path"
                then "ok"
                else throw "NixOS module has an invalid type"' >/dev/null
          done <<<"${nixos_modules}"

      - name: Commit and push
        run: |
          set -euo pipefail
          # Only reached when the check step succeeded, so the lock being
          # pushed has passed every configuration evaluation above.
          if git diff --quiet -- flake.lock; then
            echo "No flake.lock changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add flake.lock
          git commit -m "flake.lock: update Nix inputs"
          git push origin HEAD:main
