name: "Flake.lock: update and push"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  id-token: write

jobs:
  # `nix flake update` is what this workflow exists for, so it runs once and
  # its result is handed to the check shards as an artifact. The host list is
  # derived here too: nixosConfigurations is auto-discovered from directories
  # by flake.nix, so any hand-maintained list in the workflow goes stale the
  # moment a host is added, renamed or removed.
  update:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Update flake.lock
        run: nix flake update

      - name: Derive the host matrix
        id: hosts
        shell: bash
        run: |
          set -euo pipefail
          hosts="$(nix eval --raw '.#nixosConfigurations' \
            --apply 'attrs:
              builtins.toJSON (builtins.attrNames attrs)')"
          echo "hosts=${hosts}" >>"${GITHUB_OUTPUT}"

          # An empty list makes `matrix: {host: []}` a silently skipped job,
          # so fail here while the reason is still obvious. The upper bound is
          # GitHub's hard cap of 256 jobs in a single matrix.
          count="$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "${hosts}")"
          if [ "${count}" -eq 0 ]; then
            echo "::error::nixosConfigurations is empty; nothing to verify" >&2
            exit 1
          fi
          if [ "${count}" -gt 256 ]; then
            echo "::error::${count} configurations exceeds the 256-job matrix cap" >&2
            exit 1
          fi
          echo "Derived ${count} configurations to check"

      - name: Upload the updated lock
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock
          if-no-files-found: error

  # One runner per host. A single toplevel evaluation can take ~15 minutes and
  # the repository has ~36 configurations, so evaluating them sequentially in
  # one job overruns the runner budget and the job is killed mid-eval with
  # "the hosted runner lost communication with the server". Sharding gives
  # each configuration its own budget and runs them concurrently.
  check:
    needs: update
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.update.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Download the updated lock
        uses: actions/download-artifact@v4
        with:
          name: flake-lock
          # Explicit, so the lock lands at ./flake.lock in every consumer and
          # the push job's `git diff -- flake.lock` actually sees it.
          path: .

      - name: Check configuration
        shell: bash
        run: |
          set -euo pipefail

          host="${{ matrix.host }}"

          # Classify from the evaluated configuration rather than a
          # hand-maintained list. l-envil deliberately has no
          # nixosShellVmManager option (the cobalt stack moved to s-nodus), so
          # routing it down the carrier path crashed every nightly with
          # `attribute 'nixosShellVmManager' missing`; s-nodus and
          # s-nodus-nixos-hardware are the hosts that do embed every guest
          # image and must take that path.
          #
          # Prints one of: carrier | vmhost | plain
          # shellcheck disable=SC2016
          kind="$(nix eval --raw --impure --argstr host "${host}" --expr '
            { host }:
            let
              config = (builtins.getFlake (toString ./.)).nixosConfigurations.${host}.config;
              manager =
                if config ? services && config.services ? nixosShellVmManager
                then config.services.nixosShellVmManager
                else null;
            in
            if manager == null then "plain"
            else if manager.carrierControls or { } != { } then "carrier"
            else "vmhost"
          ')"

          case "${kind}" in
            carrier | vmhost)
              echo "::group::Checking ${host} with only carrier-controlled VMs enabled"
              # shellcheck disable=SC2016
              nix derivation show \
                --impure \
                --argstr host "${host}" \
                --expr '
                  { host }:
                  let
                    flake = builtins.getFlake (toString ./.);
                    original = flake.nixosConfigurations.${host};
                    manager = original.config.services.nixosShellVmManager;
                    instanceNames = builtins.attrNames manager.instances;
                    # carrierControls is optional; a host may have the
                    # manager without any carrier rule.
                    carrierInstances =
                      builtins.concatMap
                        (control: control.instances)
                        (builtins.attrValues (manager.carrierControls or { }));
                    filtered = original.extendModules {
                      modules = [
                        ({ lib, ... }: {
                          services.nixosShellVmManager.instances =
                            builtins.listToAttrs (
                              map
                                (name: {
                                  inherit name;
                                  value.enable = lib.mkForce (
                                    builtins.elem name carrierInstances
                                    || (
                                      carrierInstances == [ ]
                                      && name == builtins.head instanceNames
                                    )
                                  );
                                })
                                instanceNames
                            );
                        })
                      ];
                    };
                  in
                  filtered.config.system.build.toplevel
                ' >/dev/null
              echo "::endgroup::"
              ;;
            plain)
              echo "::group::Checking ${host}"
              nix derivation show \
                ".#nixosConfigurations.${host}.config.system.build.toplevel" >/dev/null
              echo "::endgroup::"
              ;;
            *)
              echo "::error::could not classify host '${host}' (got '${kind}')" >&2
              exit 1
              ;;
          esac

  # Everything that is not a host: packages, formatters, overlays, modules.
  # Split from the per-host matrix so it is not queued behind 36 host evals.
  check-flake-outputs:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Download the updated lock
        uses: actions/download-artifact@v4
        with:
          name: flake-lock
          path: .

      - name: Check packages, formatters, overlays and modules
        shell: bash
        run: |
          set -euo pipefail

          list_attrs() {
            nix eval --raw "$1" \
              --apply 'attrs: builtins.concatStringsSep "\n" (builtins.attrNames attrs)'
          }

          check_derivation() {
            local attribute="$1"
            echo "::group::Checking ${attribute}"
            nix derivation show ".#${attribute}" >/dev/null
            echo "::endgroup::"
          }

          systems="$(list_attrs '.#packages')"
          while IFS= read -r system; do
            [[ -n "${system}" ]] || continue
            packages="$(list_attrs ".#packages.${system}")"
            while IFS= read -r package; do
              [[ -n "${package}" ]] || continue
              check_derivation "packages.${system}.${package}"
            done <<<"${packages}"
          done <<<"${systems}"

          formatter_systems="$(list_attrs '.#formatter')"
          while IFS= read -r system; do
            [[ -n "${system}" ]] || continue
            check_derivation "formatter.${system}"
          done <<<"${formatter_systems}"

          overlays="$(list_attrs '.#overlays')"
          while IFS= read -r overlay; do
            [[ -n "${overlay}" ]] || continue
            nix eval --raw ".#overlays.${overlay}" \
              --apply 'value:
                if builtins.isFunction value
                then "ok"
                else throw "overlay is not a function"' >/dev/null
          done <<<"${overlays}"

          nixos_modules="$(list_attrs '.#nixosModules')"
          while IFS= read -r nixos_module; do
            [[ -n "${nixos_module}" ]] || continue
            nix eval --raw ".#nixosModules.${nixos_module}" \
              --apply 'value:
                if builtins.isFunction value
                  || builtins.isAttrs value
                  || builtins.typeOf value == "path"
                then "ok"
                else throw "NixOS module has an invalid type"' >/dev/null
          done <<<"${nixos_modules}"

  # Runs only when every shard above passed, so a lock that fails any
  # configuration evaluation is never pushed.
  push:
    needs: [update, check, check-flake-outputs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Download the updated lock
        uses: actions/download-artifact@v4
        with:
          name: flake-lock
          path: .

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            echo "No flake.lock changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add flake.lock
          git commit -m "flake.lock: update Nix inputs"
          git push origin HEAD:main
