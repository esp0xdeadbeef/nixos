# Cobalt site — Netgear switch 802.1Q VLAN provisioning.
#
# Switch: NETGEAR GS108PEv3 (8-port), management at 192.168.1.47 (DHCP).
#
# The switch is just an 802.1Q trunk; WAN vs LAN is decided by the router:
#   VLAN 300  = WAN
#   VLAN 20   = svc      (service plane)
#   VLAN 30   = clients  (endpoint plane)
#   VLAN 31   = clients-vpn (endpoint plane, egresses via AirVPN onyx)
#   VLAN 50   = iot      (untrusted devices)
#   VLAN 51   = iot-srv  (untrusted server uplink, onyx underlay)
#   VLAN 60   = dmz      (exposed plane)
#   VLAN 90   = unlock   (Tang-only unlock plane, no WAN/DNS)
#
# Physical port map (verified by disable-port probe + traffic capture):
#   1 -> l-envil USB  (enp0s13f0u4u4u3)  WAN (VLAN 300)
#   2 -> AirVPN egress test device (04:17:b6:64:35:ed)  untagged clients-vpn (VLAN 31)
#   3 -> l-envil dock (enp170s0)         LAN trunk (20/30/31/50/51/60)
#   4 -> ISP router                      WAN (VLAN 300)
#   5 -> l-portal USB (enu1u1)           untagged clients-vpn (VLAN 31)
#   6-8 -> empty
#
# Caveats:
# - prosafe-vlan currently ships drivers for gs108ev3/gs116ev2; GS108PEv3 may
#   need a driver alias/port added upstream.
# - Enable the switch's "Advanced 802.1Q VLAN" mode via the web UI first; the
#   tool does not enable it for you.
# - The admin password is a secret; do not commit the real value.

[switches.cobalt-switch]
address = "192.168.1.47"
# The admin password is a secret and must not be committed. Pass it via the
# PROSAFE_VLAN_PASSWORD environment variable:
#
#   PROSAFE_VLAN_PASSWORD='...' prosafe-vlan apply ./switch-vlan.toml
model = "gs108ev3"     # TODO: GS108PEv3 driver

[switches.cobalt-switch.ports]
# WAN -> l-envil USB: mgmt VLAN 1 untagged + cobalt WAN container tags VLAN 300
1 = { pvid = 1, vlans = ["1U", "300T"] }
# clients-vpn (VLAN 31) — AirVPN egress test device (MAC 04:17:b6:64:35:ed)
2 = { pvid = 31, vlans = ["31U"] }
# LAN trunk -> l-envil dock: mgmt VLAN 1 untagged, tenant VLANs tagged
3 = { pvid = 1, vlans = ["1U", "20T", "30T", "31T", "50T", "51T", "60T", "90T"] }
# WAN -> ISP router: untagged VLAN 300 (ISP router is untagged)
4 = { pvid = 300, vlans = ["300U"] }
# portal access -> l-portal USB (enu1u1): untagged clients-vpn (VLAN 31) — AirVPN egress
5 = { pvid = 31, vlans = ["31U"] }
6 = { pvid = 1, vlans = ["1U"] }
7 = { pvid = 1, vlans = ["1U"] }
8 = { pvid = 1, vlans = ["1U"] }
