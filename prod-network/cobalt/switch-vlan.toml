# Cobalt site — Netgear switch 802.1Q VLAN provisioning.
#
# Switch: NETGEAR GS108PEv3 (8-port), management at the factory-static
# 192.168.0.239 (no DHCP server serves this switch, so it keeps the factory mgmt
# IP after a reset and must be reached out-of-band).
#
# The switch is just an 802.1Q trunk; WAN vs LAN is decided by the router:
#   VLAN 300  = WAN
#   VLAN 20   = svc      (service plane)
#   VLAN 30   = clients  (endpoint plane)
#   VLAN 31   = clients-vpn (endpoint plane, egresses via onyx)
#   VLAN 50   = iot      (untrusted devices)
#   VLAN 51   = iot-srv  (untrusted server uplink, onyx underlay)
#   VLAN 60   = dmz      (exposed plane)
#   VLAN 90   = unlock   (Tang-only unlock plane, no WAN/DNS)
#
# Physical port map (current wiring):
#   1-2 -> LAN trunk (cobalt-lan0)        tagged planes (20/30/31/50/51/60/90)
#   4-5 -> untagged clients               access on VLAN 30
#   3, 6-8 -> unwired / inert
#
# History: this map used to describe the original il NAT-phase topology
# (1=l-envil WAN, 3=LAN trunk, 4=ISP router, 5=l-portal clients-vpn). Ports
# 1-2 are the tagged LAN trunk and 4-5 are untagged clients; the remaining
# defaults are bare so an accidental patch cannot land a device on the wrong
# plane.
# Caveats:
# - prosafe-vlan currently ships drivers for gs108ev3/gs116ev2; GS108PEv3 may
#   need a driver alias/port added upstream.
# - Enable the switch's "Advanced 802.1Q VLAN" mode via the web UI first; the
#   tool does not enable it for you.
# - The admin password is a secret; do not commit the real value.
# - The switch's trunk wire rides the LAN dock NIC that br-cobalt-lan carries;
#   reach it out-of-band by adding a transient mgmt helper IP on that bridge
#   (e.g. `ip addr add 192.168.0.2/24 dev br-cobalt-lan`) so 192.168.0.239 is
#   link-local, then run the apply/change-password against 192.168.0.239. A
#   freshly reset unit must first boot past the mandatory default-password gate
#   via .#cobalt-switch-bootstrap.

[switches.cobalt-switch]
address = "192.168.0.239"
# The admin password is a secret and must not be committed. Pass it via the
# PROSAFE_VLAN_PASSWORD environment variable:
#
#   PROSAFE_VLAN_PASSWORD='...' prosafe-vlan apply ./switch-vlan.toml
model = "gs108ev3"     # TODO: GS108PEv3 driver

[switches.cobalt-switch.ports]
# Ports 1-2 carry every plane as tagged frames; l-envil tags/untags per bridge.
1 = { pvid = 1, vlans = ["1U", "20T", "30T", "31T", "50T", "51T", "60T", "90T"] }
2 = { pvid = 1, vlans = ["1U", "20T", "30T", "31T", "50T", "51T", "60T", "90T"] }
# Ports 4-5 are untagged access on the clients plane, so those devices get a
# 10.2.30.0/24 DHCP lease from the clients router.
4 = { pvid = 30, vlans = ["30U"] }
5 = { pvid = 30, vlans = ["30U"] }
# Unwired: bare default VLAN only.
3 = { pvid = 1, vlans = ["1U"] }
6 = { pvid = 1, vlans = ["1U"] }
7 = { pvid = 1, vlans = ["1U"] }
8 = { pvid = 1, vlans = ["1U"] }
