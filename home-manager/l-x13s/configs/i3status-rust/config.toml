# Config for i3blocks-rs

icons_format = "{icon}"

[theme]
theme = "solarized-dark"

[theme.overrides]
#idle_bg = "#123456"
idle_bg = "#000000"
idle_fg = "#dddddd"

[icons]
icons = "awesome6"
[icons.overrides]
bat_charging = "\uf1e6 CHR" # fa-plug
bat = [
    "\uf244", # fa-battery-empty
    "\uf243", # fa-battery-quarter
    "\uf242", # fa-battery-half
    "\uf241", # fa-battery-three-quarters
    "\uf240", # fa-battery-full
]
bat_not_available = "\uf244 ? UNK" # fa-battery-empty

[[block]]
block = "net"
format = " $icon {$signal_strength $ssid $frequency|LAN} via $device "

#[[block]]
#block = "custom"
#command = "~/.config/i3status-rust/get_ipv4.sh"
#interval = 60

#[[block]]
#block = "custom"
#command = "~/.config/i3status-rust/get_ipv6.sh"
#interval = 60

[[block]]
block = "custom"
cycle = [
    "(echo -n '🏠 '; ip a s wlP6p1s0 | grep inet | grep dynamic | grep -v temp | awk '{print $2}' | sed 's|/.*||g' | tail -n2 | head -n1)",
    "(echo -n '🏠 '; ip a s wlP6p1s0 | grep inet | grep dynamic | grep -v temp | awk '{print $2}' | sed 's|/.*||g' | tail -n1 | head -n1)",
    "(echo -n '🌍 '; curl -s ifconfig.me -4)",
    "(echo -n '🌍 '; curl -s ifconfig.me -6)",
]

#prefix = "🌍 "
#cycle_format = "🌍 {}"
#format = "🌐 {output}"
#format = "🌍 {}"
#format = "🌍 {}"  # This adds an icon prefix without modifying the script
interval = 60

[[block]]
block = "sound"

[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "custom"
cycle = [
    "df -h / | awk 'NR==2 {print \"/: \"$4}'",
    "df -h /home/deadbeef/second-ssd | awk 'NR==2 {print \"mnt: \"$4}'"
]
interval = 20

#[[block]]
#block = "disk_space"
#path = "/"
#info_type = "available"
#alert_unit = "GB"
#interval = 20
#warning = 20.0
#alert = 10.0
#format = " $icon /: $available.eng(w:2) "

